<h1>drive-backup-app</h1>
<p>drive-backup-app is a private, single-user tool that stores the owner's encrypted backups in their own
Google Drive. It is not offered to anyone else.</p>
<p>It only asks for the <code>drive.file</code> permission, so it can see only the files it created itself.</p>
